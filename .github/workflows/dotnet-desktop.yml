name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FTT.sln

      - name: Build
        run: dotnet build FTT.sln --configuration ${{ matrix.configuration }} --no-restore

      - name: Test
        run: dotnet test FTT.sln --configuration ${{ matrix.configuration }} --no-build
